[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leap-projection"
version = "0.1.0"
description = "Fundamentals-driven bottom-to-peak stock projection for LEAP option planning"
requires-python = ">=3.9"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.scripts]
leap-projection = "leap_projection.cli:main"

[tool.setuptools.packages.find]
include = ["leap_projection*"]
