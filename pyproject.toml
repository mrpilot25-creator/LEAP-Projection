[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leap-projection"
version = "0.1.0"
description = "Fundamentals-driven bottom-to-peak stock projection for LEAP option planning"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
]

[project.scripts]
leap-projection = "leap_projection.cli:main"

[tool.setuptools.packages.find]
include = ["leap_projection*"]
